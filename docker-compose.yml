version: '3.8'

services:
  # 1. THE TRANSACTIONAL DATABASE NODE
  db:
    image: postgres:15-alpine
    container_name: methylox_production_db
    restart: always
    environment:
      POSTGRES_USER: methylox_user
      POSTGRES_PASSWORD: METHYLOX_DB_PASS_2026
      POSTGRES_DB: methylox_production
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_clinical_data:/var/lib/postgresql/data
    networks:
      - methylox_secure_network

  # 2. THE CORE FASTAPI SAMD ALGORITHMIC BACKEND
  backend:
    build: ./backend
    container_name: methylox_core_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://methylox_user:METHYLOX_DB_PASS_2026@db:5432/methylox_production
      - METHYLOX_JWT_SECRET=FDA_COMPLIANCE_ENCRYPTION_KEY_METHYLOX_2026
    depends_on:
      - db
    networks:
      - methylox_secure_network

  # 3. THE PREMIUM COMMERCIAL STREAMLIT FRONTEND VISUALIZER
  frontend:
    build: .
    container_name: methylox_client_frontend
    restart: always
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000/api/v1
    depends_on:
      - backend
    networks:
      - methylox_secure_network

volumes:
  postgres_clinical_data:
    driver: local

networks:
  methylox_secure_network:
    driver: bridge
